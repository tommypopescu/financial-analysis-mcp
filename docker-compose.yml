version: '3.8'

services:
  financial-mcp:
    image: ghcr.io/tommypopescu/financial-analysis-mcp:latest
    container_name: financial-analysis-mcp
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - MCP_SERVER_PORT=3000
      - LOG_LEVEL=INFO
      - CACHE_ENABLED=true
      - CACHE_TTL=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 3000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3

