version: '3.8'

services:
  financial-mcp:
    image: ghcr.io/tommypopescu/financial-analysis-mcp:latest
    container_name: financial-analysis-mcp
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
    # No ports needed - MCP uses stdio via docker exec
    # Health check verifies Python dependencies are working
    healthcheck:
      test: ["CMD", "python", "-c", "import mcp; import yfinance; import pandas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

